<script>
    //for loop
    let sum = 1;
    for(let i =1; i<5; i++){
        sum*=i;
        //sum = sum *i
        document.write("Hello from loop" + i + "<br>")
    }
    document.write(sum)
    for(let j =1; j<10; j+=2){
        document.write("Hello from loop" + j    + "<br>")
    }
    for(let k=10; k>=0; k--){
        document.write("Hi" + k + "<br>")
    }
    //input num
        // let num = Number(prompt("Enter Number"))
        // for(let n = 0; n<=num; n++){
        //     document.write(n+"Hellow")
        // }
    let price = 12.678;
    document.write( "$" + price.toFixed(2))
    //to_String convert number to string
    document.write(price.toPrecision(4) + "<br>")
    //while
    let s =0;
    while (s<=20) {
        document.write("from While loop" + "<br>");
        s++;
    }
    //do while loop
    let m =0;
    document.write(`<table border="1">`)
    document.write(`
        <tr>
            <th>Name</th>
        </tr>`)
    do{
        document.write("Hello " + "<br>");
        document.write(`<tr>
            <td>Coca</td>
            <td>12</td>
            <td>89</td>
            </tr>`)
        // document.write(`<img src="https://img.magnific.com/free-photo/closeup-scarlet-macaw-from-side-view-scarlet-macaw-closeup-head_488145-3540.jpg?semt=ais_hybrid&w=740&q=80">`)
        m++;
    }while(m <=10)
    document.write(`</table>`)
    
    //ATM
</script>
