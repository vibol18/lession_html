<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
      <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        .container{
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 100px;
        }
        .category{
            font-weight: 600;
            font-size: 15px;
        }
        .names{
            font-size: 24px;
        }
    </style>
</head>
<body>

   
    <script>
    const Product = {
        id:1,
        title:"Coca is energy drink Lorem ipsum dolor sit amet consectetur adipisicing elit. Sit repudiandae ea cum doloremque a laboriosam unde distinctio quaerat rem! Numquam ipsam pariatur adipisci magni od",
        name:"Coca",
        price:10,
        image:"https://www.coca-cola.com/content/dam/onexp/kh/en/brands/coca-cola/coca-cola-original-taste.png",
        category:"Drink"
    };
   
    document.write(`
    <div class="d-flex align-items-center container">
    <div class="card bg-info w-25 h-100 shadow-lg">
    <img src="${Product.image}" class="card-img-top">
    <div class="card-body">
    <div class="d-flex justify-content-between align-items-center">
    <p class="card-title fw-bold text-secondary names">${Product.name}</p>
    <p class="category mt-3 fw-bold text-secondary col-2">${Product.category}</p>
    </div>
    <p class="bg-danger w-25 d-flex  justify-content-center fw-bold text-light rounded-2">$${Product.price}</p>
    <p class="text-truncate fw-bold">${Product.title}</p>


    <div class="d-flex align-items-center gap-3">
        <button class="btn btn-primary">Add To Cart</button>
        <button class="btn btn-success" onclick="deletes(id)">View</button>
    </div>
    </div>
    </div>
     </div>
    `);
    function deletes(id){
        Product.filter(item=>item.id == 1);
    }
</script>
</html>
