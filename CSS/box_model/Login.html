<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
        body{
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .form-login{
            box-shadow: rgba(0, 0, 0, 0.24) 0px 3px 8px;
            width: 400px;
            height: 450px;
            border-radius: 15px;
            display: flex;
            flex-direction: column;
        }
        .name{
            display: flex;
            justify-content: center;
            font-weight: bold;
            font-size: 30px;
            margin-bottom: 100px;
            
        }
        .input{
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .input input{
            border: none;
            width: 380px;
           height: 40px;
           font-weight: bold;
          
           box-shadow: rgba(6, 24, 44, 0.4) 0px 0px 0px 2px, rgba(6, 24, 44, 0.65) 0px 4px 6px -1px, rgba(255, 255, 255, 0.08) 0px 1px 0px inset;
            border-radius: 10px;
        }
        label{
            font-weight: bold;
            font-size: 20px;
        }
        .form-content{
            display: flex;
            height: 100%;
            margin-bottom: 80px;
            border-radius: 15px;
            justify-content: center;
            align-items: center;
        
        }
        .submit{
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 100px;
        }
        .submit button{
            width: 100px;
            height: 40px;
        }
        .submit button a{
            text-decoration: none;

        }
    </style>
</head>
<body>
    <from class="form-login">
        <h1 class="name">Login</h1>
        <div class="form-content">
        <div class="input">
            <label for="">Username</label>
            <input type="text" class="username" placeholder="yourgmail@example.com">
            <label for="">Password</label>
            <input type="password" class="password" placeholder="184783">
        </div>
        </div>
        <a onclick="alert('login Success')" href="./facebook.html" class="submit" style="text-decoration: none;"><button  >Submit</button></a>
    </from>
</body>
</html>
