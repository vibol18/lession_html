<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .profile{
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background-repeat: no-repeat;
            background-size: cover;
            border: 3px solid rgb(15, 32, 210);
            background-position: center;
            background-image: url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQvRJSbkBbBiL3R0Xt8gt9dlBDfFgy7-lyuSNikXfv60A&s');
            position: absolute;
        }
        .active{
            position: relative;
            background-color: green;
            width: 20px;
            height: 20px;
            border-radius: 10px;
            top: 80px;
            left: 70px;
        }
    </style>
</head>
<body>
    <div class="profile">
        <div class="active"></div>
    </div>
</body>
</html>
