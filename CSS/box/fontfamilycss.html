<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    .p1{
       font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
        color: blue;
    }
    .p2{
        font-family: "Times New Roman", Times, serif;
        /* font-size: 100px; */
    }
    .p3{
        font-weight:500;
        font-style: italic;
        text-align: center;
        text-decoration: underline;
        color: blue;
    }
    .a1{
        text-decoration: none;
    }
    h1{
        text-shadow: 2px 5px 4px rgb(1, 111, 201);
    }

    </style>
</head>
<body>
    
    <p class="p1">Hello csssss</p>
    <p class="p2">Hello csss</p>
    <p class="p3">Bold</p>
    <i>italic</i>
    <a href="" class="a1">Hello underline</a>
    <h1 class="h1">Shadow text</h1>
</body>
</html>
