<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            padding: 0;
            margin:  0;
            box-sizing: border-box;
        }
        body{
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container{
            width: 800px;
            border: 1px solid blue;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .container .header{
            background-color: blue;
            height: 70px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .main{
            display: flex;
            justify-content: center;
            align-items: center ;
        }
        .content{
            width: 500px;
            border: 1px solid black;

        }
        .box{
            display: flex;
            gap: 5px;
        }
        .box .main-content{
            background-color: green;
            width: 70%;
            height: 70px;
        }
        .box .sidebar{
            background-color: purple;
            width: 30%;
        }
        footer{
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: blue;
            height: 70px;
        }
        
    </style>
</head>
<body>
    <div class="container">
        <header class="header">Header</header>
        <div class="main">
            <div class="content">
                <div class="box">
                    <div class="main-content">Main content</div>
                    <div class="sidebar">.sidebar</div>
                </div>

                <div>
                    <div></div>
                    <div></div>
                </div>
            </div>
        </div>
        <footer>Fotter</footer>
    </div>
</body>
</html>
