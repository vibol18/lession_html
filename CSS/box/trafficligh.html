<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container{
            border-radius: 30px;
            width: 200px;
            border: 1px solid black;
            height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
        }

        .red{
            width: 40px;
            height: 40px;
             border: 1px solid black;
             border-radius: 50%;
             background-color: red;

        }
        .blue{
            width: 40px;
            height: 40px;
             border: 1px solid black;
             border-radius: 50%;
             background-color: rgb(31, 16, 201);

        }
        .yellow{
            width: 40px;
            height: 40px;
             border: 1px solid black;
             border-radius: 50%;
             background-color: rgb(255, 230, 2);

        }
        
    </style>
</head>
<body>
    <div class="container">
        <div class="red"></div>
        <div class="blue"></div>
        <div class="yellow"></div>
    </div>
</body>
</html>
