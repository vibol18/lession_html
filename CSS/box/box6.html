<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
        body{
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .a , .b , .c{
            display: flex;
            justify-content: center;
            align-items: center;
            color: aliceblue;
            font-weight: bold;
            font-size: 20px;
        }
        .container{
            display: flex;
            gap: 20px;
        }
        .container .a{
            background-color: blue;
            width: 80px;
            height: 80px;
            border-radius: 10px;
        }
        .container .a:hover{
            background-color: green;
            border-radius: 50%;
        }
        .container .b{
            background-color: red;
            width: 70px;
            height: 80px;
            border-radius: 10px;
        }
        .container .c{
            background-color: pink;
            width: 70px;
            height: 80px;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="a">A</div>
        <div class="b">B</div>
        <div class="c">C</div>
    </div>
</body>
</html>
