<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
        body{
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .box{
            
            width: 70px;

            height: 70px;
            background-color: blue; 
            transition: 0.5s;
        }
        .box:hover{
            border-radius: 50%;
            background-size: cover;
            transform: scale(2.2);
            background-image: url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT8qh6bj65apXQ5cNMTGlRUO4JgHCyR0zNNitLecRMgYkfrvbxMuD_rVvQ&s=10');
            box-shadow: rgba(50, 50, 93, 0.25) 0px 50px 100px -20px, rgba(0, 0, 0, 0.3) 0px 30px 60px -30px, rgba(10, 37, 64, 0.35) 0px -2px 6px 0px inset;
        }
        .input:focus{
            transform: scale(0.9);
        }
        .action:active{
            background-color: blue;
            border-radius: 50%;
            height: 300px;
            width: 300px;
        }
    </style>
    <!--  -->
</head>
<body>
    <div class="box">

    </div> 
    <input type="text" class="input">
    <div class="action">
        Hello
    </div>

    
    <div>

        <div>
            <div></div>
        </div>

        <div>

        </div>

    </div>
</body>
</html>
