<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>
<body>
 <button type="button" class="btn-solid btn btn-success" commandfor="invokerDialog" command="show-modal">
  +Add Products
</button>

<dialog class="dialog rounded-5 shadow-lg" id="invokerDialog">
  <div class="dialog-header">
    <h1 class="dialog-title">+Add Product</h1>
    <button type="button" class="btn-close" commandfor="invokerDialog" command="close" aria-label="Close"></button>
  </div>
  <div class="dialog-body" style="width: 500px;">
   <form action="">
    <h4 class="m-auto">Products</h4>
    <label for="" class="form-label">Name:</label>
    <input type="text" placeholder="Enter Name" class="form-control">
    <label for="" class="form-label">Price</label>
    <input type="number" placeholder="Price" class="form-control">
    <label for="" class="form-label">Stock</label>
    <input type="number" class="form-control">
    <label for="" class="form-label">Category</label>
    <select name="" id="" class="form-select">
        <option value="">Drink</option>
        <option value="">Food</option>
        <option value="">Electric</option>
        <option value="">Kids</option>
    </select>
   </form>
   <div class="d-flex align-items-center gap-3">
    <button  type="button" class="btn btn-secondary theme-secondary mt-5" commandfor="invokerDialog" command="close">Close</button>
    <button class="btn btn-info mt-5">Confirm Add</button>
    </div>
  </div>
</dialog>
</body>
</html>
